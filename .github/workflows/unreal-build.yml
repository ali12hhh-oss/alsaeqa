name: ALSAEQA Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Source/**'
      - 'Config/**'
      - 'Content/**'
      - 'Tools/Assets/**'
      - 'Tools/Unreal/**'
      - '*.uproject'
      - '.github/workflows/unreal-build.yml'

env:
  ALSAEQA_ASSET_RELEASE_TAG: assets-v1

jobs:
  android-build:
    name: ALSAEQA Android APK
    runs-on: [self-hosted, windows]
    timeout-minutes: 180

    steps:
      - name: 01 - Checkout project
        uses: actions/checkout@v4

      - name: 02 - Verify project and Android runner
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $projectPath = Join-Path $env:GITHUB_WORKSPACE 'ALSAEQA.uproject'
          if (-not (Test-Path $projectPath)) { throw 'ALSAEQA.uproject was not found.' }

          $project = Get-Content $projectPath -Raw | ConvertFrom-Json
          if ($project.EngineAssociation -ne '5.8') {
            throw "Expected Unreal Engine 5.8, found $($project.EngineAssociation)."
          }
          if (-not $env:UE_ROOT) { throw 'UE_ROOT is not configured on this self-hosted runner.' }

          Write-Host "Project: ALSAEQA"
          Write-Host "Engine: Unreal Engine $($project.EngineAssociation)"
          Write-Host "UE_ROOT: $env:UE_ROOT"

          $editor = Join-Path $env:UE_ROOT 'Engine\Binaries\Win64\UnrealEditor-Cmd.exe'
          $uat = Join-Path $env:UE_ROOT 'Engine\Build\BatchFiles\RunUAT.bat'
          if (-not (Test-Path $editor)) { throw "UnrealEditor-Cmd.exe not found: $editor" }
          if (-not (Test-Path $uat)) { throw "RunUAT.bat not found: $uat" }
          "UE_EDITOR=$editor" | Out-File -FilePath $env:GITHUB_ENV -Append
          "UAT=$uat" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: 03 - Download and verify real assets
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          & "$env:GITHUB_WORKSPACE\Tools\Assets\Download-RealAssets.ps1" -ReleaseTag "$env:ALSAEQA_ASSET_RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw "Real asset download failed with exit code $LASTEXITCODE." }
          if (-not $env:ALSAEQA_ASSET_SOURCE_ROOTS) { throw 'Asset source roots were not produced.' }
          Write-Host "Asset source roots: $env:ALSAEQA_ASSET_SOURCE_ROOTS"

      - name: 04 - Import released authored art
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $projectPath = Join-Path $env:GITHUB_WORKSPACE 'ALSAEQA.uproject'
          $scriptPath = Join-Path $env:GITHUB_WORKSPACE 'Tools\Unreal\ImportReleaseArt.py'
          & "$env:UE_EDITOR" $projectPath -Unattended -NoSplash -NoSound -NoP4 "-ExecutePythonScript=$scriptPath"
          if ($LASTEXITCODE -ne 0) { throw "Authored-art import failed with exit code $LASTEXITCODE." }

      - name: 05 - Verify imported authored art
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $content = Join-Path $env:GITHUB_WORKSPACE 'Content'
          $uassets = @(Get-ChildItem -LiteralPath $content -Recurse -File -Filter '*.uasset' -ErrorAction SilentlyContinue)
          $umaps = @(Get-ChildItem -LiteralPath $content -Recurse -File -Filter '*.umap' -ErrorAction SilentlyContinue)
          Write-Host "Imported .uasset: $($uassets.Count)"
          Write-Host "Imported .umap: $($umaps.Count)"
          if (($uassets.Count + $umaps.Count) -eq 0) { throw 'No imported Unreal assets were found.' }

      - name: 06 - Package Android Development APK
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $projectPath = Join-Path $env:GITHUB_WORKSPACE 'ALSAEQA.uproject'
          $androidOutput = Join-Path $env:GITHUB_WORKSPACE 'Build\Android'
          New-Item -ItemType Directory -Force -Path $androidOutput | Out-Null

          & "$env:UAT" BuildCookRun `
            -project="$projectPath" `
            -noP4 `
            -platform=Android `
            -clientconfig=Development `
            -cook `
            -build `
            -stage `
            -pak `
            -prereqs `
            -archive `
            -archivedirectory="$androidOutput" `
            -utf8output

          if ($LASTEXITCODE -ne 0) { throw "Android packaging failed with exit code $LASTEXITCODE." }

      - name: 07 - Verify APK
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $apkFiles = @(Get-ChildItem -LiteralPath "$env:GITHUB_WORKSPACE\Build\Android" -Recurse -File -Filter '*.apk' -ErrorAction SilentlyContinue)
          Write-Host "APK files: $($apkFiles.Count)"
          $apkFiles | ForEach-Object { Write-Host $_.FullName }
          if ($apkFiles.Count -eq 0) { throw 'Android packaging produced no APK.' }

      - name: 08 - Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: ALSAEQA-Android-Development
          path: Build/Android/**/*.apk
          if-no-files-found: error

      - name: 09 - Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ALSAEQA-build-diagnostics
          path: |
            Build/Receipts/**
            Saved/Logs/**
          if-no-files-found: ignore
